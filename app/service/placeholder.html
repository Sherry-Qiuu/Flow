<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e121c;
        color: #e6ecff;
        font-family: "Noto Sans CJK SC", sans-serif;
      }
      main { text-align: center; max-width: 640px; padding: 32px; }
      h1 { font-size: 48px; margin: 0 0 12px; letter-spacing: 0.08em; }
      p { color: #8fa2c9; font-size: 18px; line-height: 1.6; }
      .dot {
        display: inline-block; width: 9px; height: 9px;
        border-radius: 50%; background: #f0a35e;
        margin-right: 8px; vertical-align: middle;
      }
      .ok { background: #6fd3a2; }
      #state { font-family: monospace; color: #c9d7ff; }
      .hint { font-size: 14px; color: #8fa2c9; margin-top: 28px; }
      .offline { color: #f0a35e; }
    </style>
  </head>
  <body>
    <main>
      <h1>心流 Flow</h1>
      <p><span id="dot" class="dot"></span><span id="label">正在连接服务…</span></p>
      <p id="state">state.sync 等待中</p>
      <p id="network" class="hint">在线</p>
    </main>
    <script>
      const dot = document.getElementById("dot");
      const label = document.getElementById("label");
      const state = document.getElementById("state");
      const network = document.getElementById("network");
      let delay = 500;
      function updateNetwork() {
        if (navigator.onLine) {
          network.textContent = "在线";
          network.classList.remove("offline");
        } else {
          network.textContent = "离线模式 · 本地服务仍可用";
          network.classList.add("offline");
        }
      }
      window.addEventListener("online", updateNetwork);
      window.addEventListener("offline", updateNetwork);
      updateNetwork();
      function connect() {
        const scheme = location.protocol === "https:" ? "wss" : "ws";
        const ws = new WebSocket(`${scheme}://${location.host}/ws`);
        ws.onopen = () => {
          delay = 500;
          dot.classList.add("ok");
          label.textContent = "服务已连接";
        };
        ws.onmessage = (event) => {
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === "state.sync") {
              state.textContent =
                `phase=${msg.payload.phase} channel=${msg.payload.channel}`;
            } else if (msg.type === "error") {
              state.textContent = `error: ${msg.payload.code}`;
            }
          } catch (_) { /* ignore malformed frame */ }
        };
        ws.onclose = () => {
          dot.classList.remove("ok");
          label.textContent = "服务断开，正在重连…";
          setTimeout(connect, delay);
          delay = Math.min(delay * 2, 5000);
        };
      }
      connect();
    </script>
  </body>
</html>
