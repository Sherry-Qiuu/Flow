[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-app"
version = "0.1.0"
description = "Flow local backend, hardware abstraction layer and planning engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "PyYAML>=6",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]
real = [
    "Pillow>=10",
    "sounddevice>=0.4",
    "opencv-python>=4.8",
    "gpiozero>=2",
    "lgpio>=0.2",
    "ina219>=0.3",
]
pi = [
    "Pillow>=10",
    "sounddevice>=0.4",
    "ina219>=0.3",
]

[tool.setuptools]
package-dir = { "" = "app" }
packages = [
    "analytics",
    "bus",
    "capture",
    "channel",
    "channel.builtin",
    "data",
    "demo",
    "dialogue",
    "emotion",
    "focus",
    "hal",
    "hal.mock",
    "hal.real",
    "phone",
    "plan",
    "planner",
    "scheduler",
    "service",
    "setup",
    "users",
    "voice",
]

[tool.setuptools.package-data]
service = ["placeholder.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
addopts = "-ra"
