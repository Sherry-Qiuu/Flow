name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor, 3.12 is what the Pi ships.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        env:
          PYTHONPATH: app
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Rebuild bundle
        run: npm run build
      # ui/dist is committed so the Pi never needs a toolchain; that only
      # stays true if someone rebuilds it. Advisory rather than blocking,
      # since a bundle built on another OS can differ byte-wise.
      - name: Bundle matches src
        continue-on-error: true
        run: git diff --exit-code --stat -- dist
