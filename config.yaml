app:
  name: "Flow"
  version: "0.1.0"
  host: "127.0.0.1"
  port: 8000
  timezone: "Asia/Shanghai"
  single_worker: true

data:
  dir: "data"
  db_path: "data/flow.db"

hal:
  # mock | real | auto; FLOW_HAL overrides this value.
  backend: "auto"

scheduler:
  # T15 is not implemented yet; the lifecycle slot is still reserved.
  enabled: false

gesture:
  enabled: true
  approach_cm: 60
  leave_cm: 300
  leave_hold_s: 60
  cooldown_s: 1.5
  debounce_frames: 5
  min_votes: 2
  poll_ms: 50

logging:
  level: "INFO"
  json: true

ui:
  url: "http://127.0.0.1:8000"
  size: "720x720"
