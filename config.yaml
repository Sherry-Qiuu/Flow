app:
  name: "Flow"
  version: "0.1.0"
  host: "127.0.0.1"
  port: 8000
  timezone: "Asia/Shanghai"
  single_worker: true

data:
  dir: "data"
  db_path: "data/flow.db"
  backup_dir: "data/backup"
  backup_keep: 7
  backup_hour: 3

hal:
  # mock | real | auto; FLOW_HAL overrides this value.
  backend: "auto"

scheduler:
  # T15 reminder scheduler; set false for a silent bench run.
  enabled: true

voice:
  enabled: true
  sample_rate: 16000
  pre_roll_s: 3.0
  silence_ms: 300
  vad_threshold: 0.018
  min_speech_ms: 120
  partial_interval_ms: 700
  max_utterance_s: 30
  empty_prompt_after: 3
  barge_in: true
  barge_in_threshold: 0.03
  debug_audio: false

logging:
  level: "INFO"
  json: true

ui:
  url: "http://127.0.0.1:8000"
  # CSS canvas edge, not the panel resolution: the canvas keeps its 1:1
  # aspect and scales by min(win_w/720, win_h/720). On the 7" 1024x600
  # RTD2660TP panel it renders 600x600 centred, with the page background
  # either side. The panel mode itself is set by
  # `sudo flow-display hdmi720|hdmi1024x600|hdmi1280x800|dsi`
  # (see deploy/configure-display.sh).
  size: "720x720"

# T12 LLM main path (拆解)。API key 只从 .env 的 DEEPSEEK_API_KEY 读取，
# 不要写在这里；没有 key 时自动回退内置规则引擎。
llm:
  enabled: true
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"
  timeout_s: 8.0
  cache_ttl_s: 86400
  temperature: 0.2
